upstream php {
    server wordpress:9000;
}

# Схема с 09.10.2026 (P1-1): TLS терминирует static-site, который проксирует
# сюда по HTTP (proxy_pass http://wp-nginx:80, X-Forwarded-Proto https).
# Порты 8080/8443 наружу не публикуются.

server {
    listen 80;
    server_name _;

    client_max_body_size 32M;

    root /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow:\n";
    }

    set $skip_cache 0;
    if ($query_string) { set $skip_cache 1; }
    if ($request_method != GET) { set $skip_cache 1; }
    if ($request_uri ~* "/wp-(admin|login|cron)") { set $skip_cache 1; }

    location ~ \.php$ {
        fastcgi_pass php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_cache_bypass 1;
        fastcgi_no_cache 1;
        add_header X-Cache-Status "BYPASS";

    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }
}
