name: Deploy WordPress

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: |
          DB_PASSWORD=x DB_ROOT_PASSWORD=x \
          docker compose -f docker-compose.yml config -q

      - name: PHP syntax check
        run: |
          find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Pre-deploy backup
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 85.143.101.97
          username: archive
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: /home/archive/backup/make-backup.sh

      - name: Fix permissions before deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 85.143.101.97
          username: archive
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo chown -R archive:archive /home/archive/ti200.ru/

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avz --delete --exclude='.git*' --exclude='.github' --exclude='.env' --exclude='docker-compose.dev.yml' --exclude='wp-content/uploads/'
          path: ./
          remote_path: /home/archive/ti200.ru/
          remote_host: 85.143.101.97
          remote_user: archive
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Restart containers
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 85.143.101.97
          username: archive
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/archive/ti200.ru
            docker compose up -d

      - name: Fix uploads permissions
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 85.143.101.97
          username: archive
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sleep 3
            docker exec wp-app chown -R www-data:www-data /var/www/html/wp-content/uploads/ /var/www/html/wp-content/languages/ 2>/dev/null || echo "Retry..."
            sleep 2
            docker exec wp-app chown -R www-data:www-data /var/www/html/wp-content/uploads/ /var/www/html/wp-content/languages/
